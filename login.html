<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Movie Hub</title>
    <style>
        /* Basic Reset */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: url("https://images.unsplash.com/photo-1489599849927-2ee91cede3ba") no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            flex-direction: column; /* Navbar वर राहण्यासाठी */
        }

        /* Fixed Navbar */
        nav {
            background: rgba(0, 0, 0, 0.9);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed; /* स्क्रीनवर फिक्स करण्यासाठी */
            top: 0;
            width: 100%;
            z-index: 1000;
            box-sizing: border-box;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #ff3c3c;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        nav ul {
            list-style: none;
            display: flex;
            margin: 0;
            padding: 0;
        }

        nav ul li {
            margin: 0 15px;
        }

        nav ul li a {
            text-decoration: none;
            color: white;
            font-size: 16px;
            transition: 0.3s;
        }

        nav ul li a:hover {
            color: #ff3c3c;
        }

        /* Login Container (Centering logic) */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 60px; /* Navbar खाली जागा सोडण्यासाठी */
        }

        /* Login Box */
        .login-box {
            background: rgba(0, 0, 0, 0.8);
            padding: 40px;
            border-radius: 15px;
            width: 350px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h2 { color: #ff3c3c; margin-bottom: 25px; }

        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { color: #bbb; display: block; margin-bottom: 5px; }
        .input-group input {
            width: 100%; padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid transparent; 
            color: white; border-radius: 5px;
            box-sizing: border-box;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #ff3c3c;
            outline: none;
        }

        .login-btn {
            width: 100%; padding: 12px; background: #ff3c3c;
            border: none; color: white; font-weight: bold;
            border-radius: 5px; cursor: pointer; margin-top: 10px;
            transition: 0.3s;
        }

        .login-btn:hover { background: #d32f2f; }

        .forgot-link {
            display: block; margin-top: 15px;
            color: #bbb; text-decoration: none; font-size: 14px;
        }
        .forgot-link:hover { color: #ff3c3c; }

        /* Modal CSS */
        .modal {
            display: none; position: fixed; z-index: 2000;
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.9);
            justify-content: center; align-items: center;
        }

        .modal-content {
            background: #1a1a1a; padding: 30px;
            border-radius: 10px; width: 300px; text-align: center;
            border: 1px solid #ff3c3c;
        }

        .close-btn { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">Movie Hub</div>
        <ul>
            <li><a href="Home.html">Home</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="Movies.html">Movies</a></li>
            <li><a href="About.html">About</a></li>
            <li><a href="Contact.html">Contact</a></li>
            <li><a href="Feedback.html">Feedback</a></li>
        </ul>
    </nav>

    <div class="main-content">
        <div class="login-box">
            <h2>Login</h2>
            <form id="loginForm">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="admin" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="1234" required>
                </div>
                <button type="submit" class="login-btn">Sign In</button>
            </form>
            
            <a href="#" class="forgot-link" onclick="openModal()">Forgot Password?</a>
            
            <p style="color: #888; font-size: 14px; margin-top: 20px;">
                New here? <a href="register.html" style="color:#ff3c3c; text-decoration:none;">Create account</a>
            </p>
        </div>
    </div>

    <div id="forgotModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3 style="color: white;">Reset Password</h3>
            <p style="color: #bbb; font-size: 13px;">Enter your email to receive a reset link.</p>
            <div class="input-group">
                <input type="email" id="resetEmail" placeholder="Enter your email" style="width:100%; box-sizing: border-box;">
            </div>
            <button class="login-btn" onclick="sendResetLink()">Send Link</button>
        </div>
    </div>

    <script>
        // 1. Login Logic
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            if(user === "admin" && pass === "1234") {
                localStorage.setItem("isLoggedIn", "true");
                alert("Success! Redirecting...");
                window.location.href = "index.html"; 
            } else {
                alert("Wrong credentials! Try admin / 1234");
            }
        });

        // 2. Modal Logic
        function openModal() {
            document.getElementById("forgotModal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("forgotModal").style.display = "none";
        }

        function sendResetLink() {
            const email = document.getElementById("resetEmail").value;
            if(email) {
                alert("Reset link sent to: " + email);
                closeModal();
            } else {
                alert("Please enter a valid email!");
            }
        }

        window.onclick = function(event) {
            if (event.target == document.getElementById("forgotModal")) {
                closeModal();
            }
        }
    </script>

</body>
</html>
